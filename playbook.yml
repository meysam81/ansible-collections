- name: Test roles
  hosts: all
  gather_facts: true
  become: true
  vars:
    haproxy_backends:
      - name: app
        servers:
          - name: app1
            address: 127.0.0.1
            port: 8080
    haproxy_routes:
      - backend: app
        match:
          host: example.com
  pre_tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Generate test TLS certificate for HAProxy
      ansible.builtin.import_tasks: tests/generate-test-cert.yml
      tags: haproxy
    - name: Generate test TLS certificate for zot
      ansible.builtin.import_tasks: tests/generate-zot-test-cert.yml
      tags: zot
    - name: Create the restic repository and staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: [/var/lib/restic-ci, /var/backups/restic-ci-two]
      tags: restic_backup
  roles:
    - role: haproxy
      tags: haproxy
    - role: haproxy_tls_certificate
      tags: haproxy_tls_certificate
      vars:
        haproxy_tls_certificate_email: "{{ lookup('env', 'TLS_CERT_EMAIL') }}"
        haproxy_tls_certificate_cloudflare_dns_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') }}"
    - role: cloudflare_ips
      tags: cloudflare_ips
    - role: coraza
      tags: coraza
    - role: crowdsec_haproxy_bouncer
      tags: crowdsec_haproxy_bouncer
    - role: node_exporter
      tags: node_exporter
    - role: node_textfile_metrics
      tags: node_textfile_metrics
      vars:
        node_textfile_metrics_dir: /var/lib/node-textfile-metrics
    - role: needrestart
      tags: needrestart
    - role: unattended_upgrades
      tags: unattended_upgrades
      vars:
        unattended_upgrades_timer_on_calendar: hourly
        unattended_upgrades_reboot_window_enabled: true
        unattended_upgrades_reboot_window_condition: "true"
        unattended_upgrades_reboot_window_trigger: "false"
        unattended_upgrades_reboot_window_kexec: true
    - role: vmagent
      tags: vmagent
      vars:
        vmagent_remote_write_url: "{{ lookup('env', 'VMAGENT_REMOTE_WRITE_URL') | default('http://localhost:8428/api/v1/write', true) }}"
        vmagent_allow_insecure_url: true
    - role: promtail
      tags: promtail
      vars:
        promtail_remote_write_url: "{{ lookup('env', 'PROMTAIL_REMOTE_WRITE_URL') | default('http://localhost:3100/loki/api/v1/push', true) }}"
        promtail_allow_insecure_url: true
    - role: pushgateway
      tags: pushgateway
    - role: alloy
      tags: alloy
      vars:
        alloy_config: |
          logging {
            level = "info"
          }
    - role: postfix_exporter
      tags: postfix_exporter
    - role: k8s_oidc_github_pages
      tags: k8s_oidc_github_pages
      vars:
        k8s_oidc_github_pages_repository_name: ansible-collections
        k8s_oidc_github_pages_repository_owner: meysam81
        k8s_oidc_github_pages_github_deploy_key: dummy
    - role: kratos
      tags: kratos
    - role: oathkeeper
      tags: oathkeeper
    - role: vm_identity_gcp
      tags: vm_identity_gcp
    - role: restic_backup
      tags: restic_backup
      vars:
        # Local-directory repositories: the single backup and two jobs, the
        # second with a pre-backup command that fills its staging directory.
        restic_repo_url: /var/lib/restic-ci/single
        restic_password: ci-single-password
        restic_paths: [/etc/hostname]
        restic_metrics_textfile_dir: /var/lib/restic-ci/metrics
        restic_backup_jobs:
          - name: ci-one
            repo_url: /var/lib/restic-ci/one
            password: ci-one-password
            paths: [/etc/hostname]
            read_write_paths: [/var/lib/restic-ci]
            on_calendar: hourly
          - name: ci-two
            repo_url: /var/lib/restic-ci/two
            password: ci-two-password
            paths: [/var/backups/restic-ci-two]
            pre_backup_commands:
              - echo staged > /var/backups/restic-ci-two/dump.txt
            read_write_paths: [/var/lib/restic-ci, /var/backups/restic-ci-two]
            keep_daily: 3
    - role: zot
      tags: zot
      vars:
        # Password: ci-password (test-only hash).
        zot_htpasswd_entries:
          - "ci:$2y$10$lirsF1K8LmPTiSeTSbMEautrdRETF/bJ2jRjIUo5QoOxySLxyzx0m"
        zot_requires_mounts_for: [/var/lib]
        zot_config:
          distSpecVersion: "1.1.1"
          storage:
            rootDirectory: /var/lib/zot
          http:
            address: 127.0.0.1
            port: "443"
            tls:
              cert: /etc/zot-test/cert.pem
              key: /etc/zot-test/key.pem
            auth:
              htpasswd:
                path: "{{ zot_htpasswd_path }}"
            accessControl:
              repositories:
                "**":
                  policies:
                    - users: [ci]
                      actions: [read]
                  defaultPolicy: []
  post_tasks:
    - name: Zot refuses anonymous requests
      ansible.builtin.uri:
        url: https://127.0.0.1/v2/
        validate_certs: false
        status_code: 401
      tags: zot
    - name: Zot answers an authenticated user
      ansible.builtin.uri:
        url: https://127.0.0.1/v2/
        validate_certs: false
        url_username: ci
        url_password: ci-password
        force_basic_auth: true
        status_code: 200
      tags: zot
    - name: Read the zot unit's properties
      ansible.builtin.systemd_service:
        name: zot
      register: zot_test_unit
      tags: zot
    - name: Stat the htpasswd file
      ansible.builtin.stat:
        path: /etc/zot/htpasswd
      register: zot_test_htpasswd
      tags: zot
    - name: The unit waits for the data mount and the htpasswd file is private
      ansible.builtin.assert:
        that:
          - "'/var/lib' in zot_test_unit.status.RequiresMountsFor"
          - zot_test_htpasswd.stat.mode == '0640'
      tags: zot
    - name: Stat the zot entrypoint
      ansible.builtin.stat:
        path: /usr/local/bin/zot
      register: zot_test_entrypoint
      tags: zot
    - name: The entrypoint is a symlink to the pinned release
      ansible.builtin.assert:
        that:
          - zot_test_entrypoint.stat.islnk
          - zot_test_entrypoint.stat.lnk_target is search('zot-2\.1\.23$')
      tags: zot
    - name: Run both restic jobs
      ansible.builtin.systemd:
        name: "restic-backup-{{ item }}.service"
        state: started
      loop: [ci-one, ci-two]
      tags: restic_backup
    - name: List the staged file in the second job's latest snapshot
      ansible.builtin.shell: |
        set -eu
        set -a
        . /etc/restic/jobs/ci-two.env
        restic ls latest
      args:
        executable: /bin/bash
      register: restic_test_ls
      changed_when: false
      tags: restic_backup
    - name: Read the job metrics
      ansible.builtin.slurp:
        src: /var/lib/restic-ci/metrics/restic_backup_ci-two.prom
      register: restic_test_metrics
      tags: restic_backup
    - name: The pre-backup command ran first and the metrics carry the job label
      ansible.builtin.assert:
        that:
          - "'/var/backups/restic-ci-two/dump.txt' in restic_test_ls.stdout"
          - restic_test_metrics.content | b64decode is search('restic_backup_last_exit_code[{]job="ci-two",tag="auto"[}] 0')
      tags: restic_backup
    - name: Drop a job and run the role again
      ansible.builtin.include_role:
        name: restic_backup
        apply:
          tags: restic_backup
      vars:
        restic_metrics_textfile_dir: /var/lib/restic-ci/metrics
        restic_backup_jobs:
          - name: ci-two
            repo_url: /var/lib/restic-ci/two
            password: ci-two-password
            paths: [/var/backups/restic-ci-two]
            read_write_paths: [/var/lib/restic-ci, /var/backups/restic-ci-two]
      tags: restic_backup
    - name: Stat the retired job's timer and env file
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/restic-backup-ci-one.timer
        - /etc/restic/jobs/ci-one.env
      register: restic_test_retired
      tags: restic_backup
    - name: The retired job is gone and the remaining one is kept
      ansible.builtin.assert:
        that:
          - restic_test_retired.results | map(attribute='stat.exists') | select | list | length == 0
      tags: restic_backup
    - name: Test tang_server
      ansible.builtin.import_tasks: tests/tang-server-test.yml
      tags: tang_server
    - name: Test nbde_client
      ansible.builtin.import_tasks: tests/nbde-client-test.yml
      tags: nbde_client
