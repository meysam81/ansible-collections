- name: Test roles
  hosts: all
  gather_facts: true
  become: true
  vars:
    haproxy_backends:
      - name: app
        servers:
          - name: app1
            address: 127.0.0.1
            port: 8080
    haproxy_routes:
      - backend: app
        match:
          host: example.com
  pre_tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Generate test TLS certificate for HAProxy
      ansible.builtin.import_tasks: tests/generate-test-cert.yml
      tags: haproxy
  roles:
    - role: haproxy
      tags: haproxy
    - role: haproxy_tls_certificate
      tags: haproxy_tls_certificate
      vars:
        haproxy_tls_certificate_email: "{{ lookup('env', 'TLS_CERT_EMAIL') }}"
        haproxy_tls_certificate_cloudflare_dns_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') }}"
    - role: cloudflare_ips
      tags: cloudflare_ips
    - role: coraza
      tags: coraza
    - role: crowdsec_haproxy_bouncer
      tags: crowdsec_haproxy_bouncer
    - role: node_exporter
      tags: node_exporter
    - role: node_textfile_metrics
      tags: node_textfile_metrics
      vars:
        node_textfile_metrics_dir: /var/lib/node-textfile-metrics
    - role: needrestart
      tags: needrestart
    - role: unattended_upgrades
      tags: unattended_upgrades
      vars:
        unattended_upgrades_timer_on_calendar: hourly
        unattended_upgrades_reboot_window_enabled: true
        unattended_upgrades_reboot_window_condition: "true"
        unattended_upgrades_reboot_window_trigger: "false"
        unattended_upgrades_reboot_window_kexec: true
    - role: vmagent
      tags: vmagent
      vars:
        vmagent_remote_write_url: "{{ lookup('env', 'VMAGENT_REMOTE_WRITE_URL') | default('http://localhost:8428/api/v1/write', true) }}"
        vmagent_allow_insecure_url: true
    - role: promtail
      tags: promtail
      vars:
        promtail_remote_write_url: "{{ lookup('env', 'PROMTAIL_REMOTE_WRITE_URL') | default('http://localhost:3100/loki/api/v1/push', true) }}"
        promtail_allow_insecure_url: true
    - role: pushgateway
      tags: pushgateway
    - role: alloy
      tags: alloy
      vars:
        alloy_config: |
          logging {
            level = "info"
          }
    - role: postfix_exporter
      tags: postfix_exporter
    - role: k8s_oidc_github_pages
      tags: k8s_oidc_github_pages
      vars:
        k8s_oidc_github_pages_repository_name: ansible-collections
        k8s_oidc_github_pages_repository_owner: meysam81
        k8s_oidc_github_pages_github_deploy_key: dummy
    - role: kratos
      tags: kratos
    - role: oathkeeper
      tags: oathkeeper
    - role: vm_identity_gcp
      tags: vm_identity_gcp

# ssh_ca_trust rewrites sshd and creates login users, so it gets its own play
# with throwaway CAs and keys: run it only on a disposable host or CI runner.
- name: Test ssh_ca_trust
  hosts: all
  gather_facts: true
  become: true
  tags: ssh_ca_trust
  vars:
    ssh_ca_trust_user_ca_keys:
      - "{{ ssh_ca_trust_test_pub.op_ca }}"
    ssh_ca_trust_principals:
      operator-test:
        - operator
    ssh_ca_trust_users:
      - name: operator-test
        sudo: true
      - name: deploy
        sudo: true
      - name: jump-test
        shell: /usr/sbin/nologin
    ssh_ca_trust_authorized_keys:
      - user: deploy
        keys:
          - cert-authority,principals="test-deploy" {{ ssh_ca_trust_test_pub.ci_ca }}
      - user: jump-test
        exclusive: true
        keys:
          - >-
            restrict,port-forwarding,permitopen="127.0.0.1:22",command="/usr/sbin/nologin",cert-authority,principals="test-jump"
            {{ ssh_ca_trust_test_pub.ci_ca }}
  tasks:
    - name: Prepare sshd, throwaway CAs and a pre-existing plain key
      ansible.builtin.import_tasks: tests/ssh_ca_trust/prepare.yml
    - name: Apply ssh_ca_trust
      ansible.builtin.import_role:
        name: ssh_ca_trust
    - name: Verify every login the role allows and denies
      ansible.builtin.import_tasks: tests/ssh_ca_trust/verify.yml
