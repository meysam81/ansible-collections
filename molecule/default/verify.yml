---
- name: Verify new roles
  hosts: all
  become: true
  tasks:
    # ── blocklist_updater ─────────────────────────
    - name: Check blocklist directory exists
      ansible.builtin.stat:
        path: /tmp/blocklists
      register: blocklist_dir
      tags: blocklist_updater

    - name: Assert blocklist directory exists
      ansible.builtin.assert:
        that:
          - blocklist_dir.stat.exists
          - blocklist_dir.stat.isdir
      tags: blocklist_updater

    - name: Check update-blocklists script exists
      ansible.builtin.stat:
        path: /usr/local/bin/update-blocklists
      register: blocklist_script
      tags: blocklist_updater

    - name: Assert update-blocklists script is executable
      ansible.builtin.assert:
        that:
          - blocklist_script.stat.exists
          - blocklist_script.stat.executable
      tags: blocklist_updater

    - name: Gather service facts for blocklist_updater
      ansible.builtin.service_facts:
      tags: blocklist_updater

    - name: Assert blocklist-updater timer is active and enabled
      ansible.builtin.assert:
        that:
          - "'blocklist-updater.timer' in ansible_facts.services"
          - ansible_facts.services['blocklist-updater.timer'].state == 'active'
          - ansible_facts.services['blocklist-updater.timer'].status == 'enabled'
      tags: blocklist_updater

    # ── squid ─────────────────────────────────────
    - name: Gather service facts for squid
      ansible.builtin.service_facts:
      tags: squid

    - name: Assert squid service is running and enabled
      ansible.builtin.assert:
        that:
          - "'squid.service' in ansible_facts.services"
          - ansible_facts.services['squid.service'].state == 'running'
          - ansible_facts.services['squid.service'].status == 'enabled'
      tags: squid

    - name: Check squid configuration is valid
      ansible.builtin.command:
        cmd: squid -k parse
      register: squid_parse
      changed_when: false
      failed_when: false
      tags: squid

    - name: Assert squid configuration is valid
      ansible.builtin.assert:
        that:
          - squid_parse.rc == 0
      tags: squid

    - name: Check squid log directory exists
      ansible.builtin.stat:
        path: /var/log/squid
      register: squid_log_dir
      tags: squid

    - name: Assert squid log directory exists with correct ownership
      ansible.builtin.assert:
        that:
          - squid_log_dir.stat.exists
          - squid_log_dir.stat.isdir
      tags: squid

    - name: Check squid logrotate config exists
      ansible.builtin.stat:
        path: /etc/logrotate.d/squid-json
      register: squid_logrotate
      when: squid_access_log_format | default('json') == 'json'
      tags: squid

    - name: Assert squid logrotate config exists
      ansible.builtin.assert:
        that:
          - squid_logrotate.stat.exists
      when: squid_access_log_format | default('json') == 'json'
      tags: squid

    # ── crowdsec_agent ────────────────────────────
    - name: Gather service facts for crowdsec_agent
      ansible.builtin.service_facts:
      tags: crowdsec_agent

    - name: Assert crowdsec service is running and enabled
      ansible.builtin.assert:
        that:
          - "'crowdsec.service' in ansible_facts.services"
          - ansible_facts.services['crowdsec.service'].state == 'running'
          - ansible_facts.services['crowdsec.service'].status == 'enabled'
      tags: crowdsec_agent

    - name: Check CrowdSec GPG keyring exists
      ansible.builtin.stat:
        path: /usr/share/keyrings/crowdsec-archive-keyring.gpg
      register: crowdsec_keyring
      tags: crowdsec_agent

    - name: Assert CrowdSec GPG keyring exists
      ansible.builtin.assert:
        that:
          - crowdsec_keyring.stat.exists
      tags: crowdsec_agent

    - name: Check CrowdSec collections are installed
      ansible.builtin.command:
        cmd: cscli collections list -o raw
      register: crowdsec_collections
      changed_when: false
      tags: crowdsec_agent

    - name: Assert default collections are installed
      ansible.builtin.assert:
        that:
          - "'http-probing' in crowdsec_collections.stdout"
          - "'iptables' in crowdsec_collections.stdout"
      tags: crowdsec_agent

    # ── node_textfile_metrics ──────────────────────
    - name: Check node_textfile_metrics textfile exists
      ansible.builtin.stat:
        path: /var/lib/node-textfile-metrics/node_textfile_metrics.prom
      register: node_textfile_metrics_file
      tags: node_textfile_metrics

    - name: Read node_textfile_metrics textfile content
      ansible.builtin.slurp:
        src: /var/lib/node-textfile-metrics/node_textfile_metrics.prom
      register: node_textfile_metrics_content
      tags: node_textfile_metrics

    - name: Assert node_textfile_metrics textfile exists and reports node_reboot_required
      ansible.builtin.assert:
        that:
          - node_textfile_metrics_file.stat.exists
          - "'node_reboot_required' in (node_textfile_metrics_content.content | b64decode)"
      tags: node_textfile_metrics

    # ── unattended_upgrades ────────────────────────
    - name: Read the effective unattended-upgrades configuration
      ansible.builtin.command:
        cmd: apt-config dump Unattended-Upgrade APT::Periodic APT::Snapshot
      register: unattended_upgrades_config
      changed_when: false
      tags: unattended_upgrades

    # What apt (and unattended-upgrades) actually installs from; indextargets
    # would also list the shadowed originals apt keeps for server discovery.
    - name: Read the APT sources in use
      ansible.builtin.command:
        cmd: apt-cache policy
      register: unattended_upgrades_policy
      changed_when: false
      tags: unattended_upgrades

    - name: Read the installed apt version
      ansible.builtin.command:
        cmd: dpkg-query -W -f=${Version} apt
      register: unattended_upgrades_apt
      changed_when: false
      tags: unattended_upgrades

    # Debian 12's apt 2.6 has no snapshot support: security updates only.
    - name: Assert hosts without snapshot support install security updates only
      ansible.builtin.assert:
        that:
          - "'APT::Snapshot' not in unattended_upgrades_config.stdout"
          - "'-updates' not in unattended_upgrades_config.stdout"
          - "'-security' in unattended_upgrades_config.stdout"
      when: ansible_facts['distribution'] == 'Debian' and unattended_upgrades_apt.stdout is version('2.7', '<')
      tags: unattended_upgrades

    - name: Assert regular updates are delayed and security is live
      when: ansible_facts['distribution'] == 'Ubuntu' or unattended_upgrades_apt.stdout is version('2.7', '>=')
      vars:
        _security: "{{ unattended_upgrades_policy.stdout_lines | select('search', ' ' ~ ansible_facts['distribution_release'] ~ '-security/') | list }}"
        _updates: "{{ unattended_upgrades_policy.stdout_lines | select('search', ' ' ~ ansible_facts['distribution_release'] ~ '-updates/') | list }}"
        _snapshot: "{{ lookup('pipe', 'date -u -d \"14 days ago\" +%Y%m%dT000000Z') }}"
      ansible.builtin.assert:
        that:
          - "'APT::Snapshot \"' ~ _snapshot ~ '\"' in unattended_upgrades_config.stdout"
          - "'-updates' in unattended_upgrades_config.stdout"
          - _updates | length > 0
          - _updates | reject('search', '/snapshot\\.[a-z]+\\.(com|org)/.*' ~ _snapshot) | list | length == 0
          - _security | length > 0
          - _security | select('search', 'snapshot\\.') | list | length == 0
      tags: unattended_upgrades

    # service_facts only lists .service units, not timers.
    - name: Read apt-daily and reboot-if-required timer states
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: unattended_upgrades_timers
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - reboot-if-required.timer
      tags: unattended_upgrades

    - name: Assert apt-daily and reboot-if-required timers are active and enabled
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == 'active'
          - item.status.UnitFileState == 'enabled'
        quiet: true
      loop: "{{ unattended_upgrades_timers.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: unattended_upgrades
