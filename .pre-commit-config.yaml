ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    [skip ci]
  autofix_prs: true
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate

    [skip ci]
  autoupdate_schedule: weekly
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=800"]
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
        exclude: .*templates/.*j2$
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: mkdocs.yml
      - id: detect-private-key
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
      - id: name-tests-test
      - id: file-contents-sorter
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            roles/haproxy/README.md|
            roles/blocklist_updater/README.md
          )$
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
  # - repo: https://github.com/ansible/ansible-lint
  #   rev: v24.9.0
  #   hooks:
  #     - id: ansible-lint
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347 # frozen: v9.26.0
    hooks:
      - id: commitlint
        language: node
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49 # frozen: v0.16.5
    hooks:
      - id: ruff
        types_or:
          - python
          - pyi
          - jupyter
        args:
          - --fix
          - --select=I
      - id: ruff-format
        types_or:
          - python
          - pyi
          - jupyter
  - repo: https://github.com/thegeeklab/ansible-doctor
    rev: d1c7fa94ec20955955a95c78aaf96b55b9ea58b0 # frozen: v8.4.1
    hooks:
      - id: ansible-doctor
        name: ansible-doctor
        args:
          - -rf
          - ./roles
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
