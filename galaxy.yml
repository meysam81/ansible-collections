namespace: meysam81
name: general
version: 1.12.0
readme: README.md
authors:
  - Meysam Azad <meysam@developer-friendly.blog>
description: A collection of personal & opinionated Ansible roles
license:
  - Apache-2.0
tags:
  - application
  - cloud
  - database
  - infrastructure
  - linux
  - monitoring
  - networking
  - security
