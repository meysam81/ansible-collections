---
coraza_spoa_version: "0.3.0"
coraza_config_version: "3.3.3"
coraza_coreruleset_version: "4.17.1"
# Pin to specific commit SHA for supply chain integrity (update when bumping versions)
coraza_spoa_commit: ""
coraza_coreruleset_commit: ""
coraza_spoa_addr: "127.0.0.1"
coraza_spoa_port: 9000
coraza_config_dir: "/etc/coraza-spoa"
coraza_go_install_dir: "/usr/local"
coraza_haproxy_config_dir: "/etc/haproxy"

# SPOE "log global" writes one journal line per request/response exchanged
# with the coraza-spoa agent — on a busy frontend this can dwarf every other
# log source. Off by default; the WAF verdict itself still reaches the
# access log via haproxy_config's spoa-error:/waf-hit: log-format fields
# whenever haproxy_coraza_enabled is true, regardless of this setting.
coraza_spoe_log_events: false
