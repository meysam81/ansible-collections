---
# Order matters: handlers run in the order listed here, and the snapshot
# must be pinned before the cache update that fetches from it.
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Pin APT snapshot
  ansible.builtin.command:
    cmd: /usr/local/sbin/apt-delay-snapshot
  changed_when: true
  notify: Update APT cache

# apt-get, not the apt module: python-apt raises FetchFailedException when
# any index cannot be fetched, so a snapshot server outage (they answer 5xx
# under load, for hours at times) failed the whole play. apt-get keeps the
# previous index, warns and exits 0, as on the apt-daily timer; malformed
# sources or bad signatures still fail. The retries cover a concurrent
# apt-daily run holding the lists lock.
- name: Update APT cache
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: apt-get update
  register: unattended_upgrades_apt_update
  changed_when: true
  until: unattended_upgrades_apt_update is succeeded
  retries: 3
  delay: 30

- name: Restart apt-daily timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Restart reboot-if-required timer
  ansible.builtin.systemd:
    name: reboot-if-required.timer
    state: restarted
  when: not (ansible_check_mode and unattended_upgrades_reboot_units is changed)
