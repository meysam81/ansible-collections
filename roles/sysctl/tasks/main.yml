---
- name: Assert sysctl_params is a non-empty dict
  ansible.builtin.assert:
    that:
      - sysctl_params is mapping
      - sysctl_params | length > 0
    fail_msg: "sysctl_params must be a non-empty dict"

- name: Ensure sysctl.d directory exists
  ansible.builtin.file:
    path: "{{ sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ansible.posix.sysctl checks the LIVE kernel value (via `sysctl -n`) on
# every run, not just this role's own file, and re-applies whenever it has
# drifted. A plain templated file + notify-on-change reload (the previous
# approach here) only re-applies when OUR file's content changes — but
# another tool reapplying its own overlapping sysctl file between runs
# (confirmed live: `ufw enable`, which Debian's ufw package runs on every
# enable, not just the first transition, reapplies /etc/ufw/sysctl.conf and
# silently reset net.ipv4.conf.all.log_martians to 0) leaves our file
# untouched and matching, so the notify never re-fires and the live value
# stays wrong indefinitely. Looping the module per key also gives an
# accurate per-key changed status — unlike an unconditional `sysctl
# --system`, this reports changed=false once every value has converged.
- name: Ensure sysctl values are live and persisted
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ sysctl_file }}"
    sysctl_set: true
    reload: "{{ sysctl_reload }}"
    state: present
  loop: "{{ sysctl_params | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
