---
- name: Assert sysctl_params is a non-empty dict
  ansible.builtin.assert:
    that:
      - sysctl_params is mapping
      - sysctl_params | length > 0
    fail_msg: "sysctl_params must be a non-empty dict"

- name: Ensure sysctl.d directory exists
  ansible.builtin.file:
    path: "{{ sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy sysctl configuration
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ sysctl_file }}"
    owner: root
    group: root
    mode: "0644"

# Unconditional, not notify-on-change: another tool applying its own sysctl
# file between our runs (e.g. `ufw enable` re-applying /etc/ufw/sysctl.conf,
# which happens on every enable, not just the first) can silently overwrite
# a live value this role also manages, for any key the two files overlap
# on. A notify-only reload never re-fires once our own file already matches
# on disk, so a value clobbered this way would stay wrong indefinitely.
# Re-running `sysctl --system` is cheap and idempotent, so just always do
# it — this role's job is the live value, not merely the file on disk.
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  when: sysctl_reload
