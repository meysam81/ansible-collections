---
# ── Version & download ──────────────────────────────────────────────
k3s_version: "1.35.3+k3s1"
k3s_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
k3s_binary_suffix: "{{ '-arm64' if k3s_arch == 'arm64' else '' }}"
k3s_download_url: >-
  https://github.com/k3s-io/k3s/releases/download/v{{ k3s_version }}/k3s{{ k3s_binary_suffix }}
k3s_force_download: false

# Integrity of the downloaded binary (it is installed as root).
# k3s_binary_sha256: explicit pin of the binary for k3s_arch; wins when set.
#   Take it from the release's sha256sum-<arch>.txt, e.g.
#   curl -fsSL https://github.com/k3s-io/k3s/releases/download/v<version>/sha256sum-amd64.txt
# k3s_checksum_url: used when k3s_binary_sha256 is empty; the binary is verified
#   against the checksum file the release publishes (protects against a corrupted
#   or tampered download, not against a compromised release).
k3s_binary_sha256: ""
k3s_checksum_url: >-
  https://github.com/k3s-io/k3s/releases/download/v{{ k3s_version }}/sha256sum-{{ k3s_arch }}.txt

# ── Token ───────────────────────────────────────────────────────────
# Required — playbook must supply this value
k3s_token: ""
k3s_token_file: /var/lib/k3s-token

# ── Core toggles ───────────────────────────────────────────────────
k3s_embedded_registry: true
k3s_secrets_encryption: true
k3s_disable_network_policy: true
k3s_flannel_backend: "none"

# Components to disable (e.g. traefik, servicelb, local-storage)
k3s_disable_components:
  - traefik

# ── TLS SANs ───────────────────────────────────────────────────────
# Additional Subject Alternative Names for the API server certificate
k3s_tls_san: []

# ── kube-apiserver args ────────────────────────────────────────────
# Each entry is a key=value string passed as --kube-apiserver-arg
k3s_kube_apiserver_args: []

# ── Escape hatch ───────────────────────────────────────────────────
# Additional CLI flags appended verbatim to ExecStart
k3s_extra_args: []
