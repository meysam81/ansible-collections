---
# Restic repository URL. For S3-compatible stores: "s3:<endpoint>/<bucket>/<path>".
# For local: "/path/to/repo". For SFTP: "sftp:user@host:/path". Required.
restic_repo_url: ""

# Encryption password for the repository. Caller MUST resolve via secret store
# (SSM, vault) and pass at playbook time. Protected with no_log throughout.
restic_password: ""

# S3 / S3-compatible credentials. Required when restic_repo_url is "s3:...".
# Caller resolves these via secret store and passes at playbook time.
restic_aws_access_key_id: ""
restic_aws_secret_access_key: ""

# Optional: extra environment variables (e.g. RESTIC_CACHE_DIR override).
# Each entry is "KEY=value". Rendered into the env file as-is.
restic_extra_env: []

# Persistent restic cache dir. The systemd unit's ProtectHome=read-only
# would otherwise force the default /root/.cache/restic to read-only and
# trigger a no-cache fallback (3-5x slower, 3-5x more S3 GET requests).
# Pre-created by the role and added to the unit's ReadWritePaths.
restic_cache_dir: /var/cache/restic

# Paths to back up. At least one is required.
restic_paths: []

# Glob patterns excluded from backup (passed to restic --exclude).
restic_exclude_patterns: []

# Retention policy. Pruned via `restic forget --prune` after each successful
# backup run. Set any of these to 0 to disable that bucket.
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12
restic_keep_yearly: 0

# Backup schedule (systemd OnCalendar format).
restic_backup_on_calendar: "*-*-* 03:00:00"
restic_backup_random_delay_sec: 1800

# Integrity check schedule. The check job verifies metadata + a sampled subset
# of pack files. Disable if your backend bills per request and check costs
# outweigh the value.
restic_check_enabled: true
restic_check_read_data_subset: "10%"
restic_check_on_calendar: "Sun *-*-* 04:00:00"
restic_check_random_delay_sec: 600

# Tag applied to automatic snapshots.
restic_snapshot_tag: "auto"

# Initialise the repository on first run if it doesn't exist. Set to false
# once your repo is established to fail loudly on accidental misconfig.
restic_init_if_missing: true

# When set, the backup and check scripts write node-exporter textfile
# metrics (*.prom) into this directory after every run, so a stale or
# failing backup can page: restic_backup_last_success_timestamp_seconds,
# restic_backup_last_exit_code, and the restic_check_* equivalents.
# Empty disables. Pair with the `alloy` role's alloy_textfile_dir.
restic_metrics_textfile_dir: ""

# Several independent backup jobs on one host, each with its own repository,
# password, schedule, env file, systemd service and timer
# (restic-backup-<name>.{service,timer}). Empty keeps the single-repository
# backup above as the only job. When non-empty, the single-repository backup
# and its integrity check are deployed only if restic_repo_url is set.
#
# Entry keys:
#   name                  Required. Unique, [a-z0-9-]+. Suffix of every file and unit.
#   repo_url, password    Required.
#   paths                 Required, non-empty. What `restic backup` reads.
#   pre_backup_commands   Optional list of shell commands run in order before
#                         `restic backup`. A failing command fails the job:
#                         nothing is backed up and the metrics report the failure.
#   on_calendar           Optional, falls back to restic_backup_on_calendar.
#   read_write_paths      Optional list of directories the pre-backup commands
#                         write to (staging dirs). The unit is otherwise
#                         read-only (ProtectSystem=strict), so they must exist.
#   exclude_patterns, keep_daily, keep_weekly, keep_monthly, keep_yearly, tag,
#   aws_access_key_id, aws_secret_access_key, extra_env
#                         Optional, each falls back to the role variable of the
#                         same meaning (restic_exclude_patterns, ...).
# Passwords and keys live in the 0600 env file and are never logged.
# Example:
#   restic_backup_jobs:
#     - name: app-one
#       repo_url: "s3:https://s3.example.com/bucket/app-one"
#       password: "{{ lookup('env', 'APP_ONE_RESTIC_PASSWORD') }}"
#       paths: [/var/backups/app-one]
#       pre_backup_commands:
#         - sqlite3 /var/lib/app-one/app.db ".backup /var/backups/app-one/app.db"
#       read_write_paths: [/var/backups/app-one]
#       on_calendar: hourly
restic_backup_jobs: []

# Systemd unit started via OnFailure= when a backup service fails (single
# backup and every job). Empty disables.
restic_backup_on_failure_unit: ""
