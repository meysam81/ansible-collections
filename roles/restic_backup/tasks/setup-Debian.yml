---
- name: Decide whether the single-repository backup is in use
  ansible.builtin.set_fact:
    # With no jobs this is the original behaviour. With jobs, the single
    # backup is opt-in by setting restic_repo_url.
    restic_backup_single_enabled: "{{ restic_backup_jobs | length == 0 or restic_repo_url | length > 0 }}"

- name: Assert required variables
  when: restic_backup_single_enabled | bool
  ansible.builtin.assert:
    that:
      - restic_repo_url | length > 0
      - restic_password | length > 0
      - restic_paths | length > 0
      - (not (restic_repo_url is regex('^s3:'))) or (restic_aws_access_key_id | length > 0 and restic_aws_secret_access_key | length > 0)
    fail_msg: >-
      restic_repo_url, restic_password, and restic_paths are required;
      restic_aws_access_key_id and restic_aws_secret_access_key are required
      when restic_repo_url uses an s3: backend.

- name: Assert backup job names are unique
  ansible.builtin.assert:
    that:
      - restic_backup_jobs | map(attribute='name', default='') | unique | list | length == restic_backup_jobs | length
    fail_msg: restic_backup_jobs names must be unique.
  when: restic_backup_jobs | length > 0

- name: Assert backup jobs are complete
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[a-z0-9-]+$')
      - item.name | default('') == item.name | default('') | trim
      - item.repo_url | default('') | length > 0
      - item.password | default('') | length > 0
      - item.paths | default([]) | length > 0
      - item.pre_backup_commands | default([]) is sequence
      - item.pre_backup_commands | default([]) is not string
      - >-
        not (item.repo_url | default('') is regex('^s3:'))
        or (item.aws_access_key_id | default(restic_aws_access_key_id) | length > 0
        and item.aws_secret_access_key | default(restic_aws_secret_access_key) | length > 0)
    fail_msg: >-
      Every restic_backup_jobs entry needs a name matching ^[a-z0-9-]+$, a
      repo_url, a password, a non-empty paths list and a list of
      pre_backup_commands; s3: repositories also need AWS credentials on the
      job or via restic_aws_access_key_id / restic_aws_secret_access_key.
      Offending job: {{ item.name | default('<unnamed>') }}.
  loop: "{{ restic_backup_jobs }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true

- name: Ensure /etc/restic exists
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure restic cache dir exists
  ansible.builtin.file:
    path: "{{ restic_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure metrics textfile dir exists
  ansible.builtin.file:
    path: "{{ restic_metrics_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: restic_metrics_textfile_dir | length > 0

- name: Import the single-repository backup
  ansible.builtin.import_tasks: legacy.yml
  when: restic_backup_single_enabled | bool

- name: Import the backup jobs
  ansible.builtin.import_tasks: jobs.yml
