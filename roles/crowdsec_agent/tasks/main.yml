---
- name: Assert LAPI listen address format
  ansible.builtin.assert:
    that:
      - "':' in crowdsec_agent_lapi_listen"
    fail_msg: "crowdsec_agent_lapi_listen must be in 'host:port' format (got: {{ crowdsec_agent_lapi_listen }})"

- name: Assert acquis filename is safe
  ansible.builtin.assert:
    that:
      - crowdsec_agent_acquis_filename is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "crowdsec_agent_acquis_filename must be a simple name (alphanumeric, dash, underscore)"

- name: Assert collections list is non-empty
  ansible.builtin.assert:
    that:
      - crowdsec_agent_collections | length > 0
    fail_msg: "crowdsec_agent_collections must contain at least one collection"

- name: Assert journal acquisition entries are well-formed
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is match('^[a-zA-Z0-9_.-]+$')
      - item.type is defined
      - (item.units | default([]) | length > 0) or (item.identifiers | default([]) | length > 0)
    fail_msg: "Invalid crowdsec_agent_journal_acquisitions entry (needs name, type, and at least one of units/identifiers): {{ item }}"
  loop: "{{ crowdsec_agent_journal_acquisitions }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Setup CrowdSec agent on Debian/Ubuntu
  ansible.builtin.import_tasks: setup-Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

# Ansible drops queued handlers when a play fails later on, and the next run
# sees the file already in place and never re-notifies: the config on disk
# and the running daemon silently diverge. Flushing here keeps the reload
# inside this role's own blast radius.
- name: Apply pending service reloads before leaving the role
  ansible.builtin.meta: flush_handlers
