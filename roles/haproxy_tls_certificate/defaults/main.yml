---
haproxy_tls_certificate_email: ""
haproxy_tls_certificate_haproxy_certs_dir: /etc/haproxy/certs
haproxy_tls_certificate_lego_cert_dir: "/etc/lego/certificates"
haproxy_tls_certificate_served_domains: []
# haproxy_tls_certificate_cloudflare_dns_api_token must be provided at runtime (no_log protected)

# Resolvers lego uses for the DNS-01 propagation check, as "host:port".
# Leave empty to use the host's /etc/resolv.conf. Set this when the host
# runs a local recursive/caching resolver: such resolvers negatively cache
# the _acme-challenge name (RFC 2308) and lego's propagation check then
# times out while the record is already live. Example:
#   haproxy_tls_certificate_dns_resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
haproxy_tls_certificate_dns_resolvers: []
