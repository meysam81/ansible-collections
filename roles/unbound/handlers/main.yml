---
# Validate-before-swap is the safety guardrail: a typo in unbound.conf
# fails the playbook BEFORE the live config is overwritten, so the
# running unbound keeps serving its previous valid config.

# Three handlers share one `listen:` topic so a single notification fans
# out into validate → swap → reload, executed in declaration order.
# Block-wrapped handlers are not notifiable in Ansible — only top-level
# `name:` entries (or `listen:` topics) are.

- name: Validate staged unbound config
  ansible.builtin.command:
    cmd: /usr/sbin/unbound-checkconf /etc/unbound/unbound.conf.next
  changed_when: false
  listen: Validate and activate unbound config

- name: Atomically swap validated config into place
  ansible.builtin.command:
    cmd: mv /etc/unbound/unbound.conf.next /etc/unbound/unbound.conf
  changed_when: true
  listen: Validate and activate unbound config

- name: Reload unbound (apply new config without dropping queries)
  ansible.builtin.systemd:
    name: unbound
    state: reloaded
  register: unbound_reload
  failed_when: false
  listen: Validate and activate unbound config

# A reload cannot apply a config that moves the control socket: the running
# daemon (on a fresh install, the one the package postinst started with the
# stock Debian config) listens elsewhere, so unbound-control cannot reach it
# and systemd reports the reload job failed. A restart picks up the swapped
# config; every other reload failure surfaces here too instead of being lost.
- name: Restart unbound when reload could not apply the config
  ansible.builtin.systemd:
    name: unbound
    state: restarted
    daemon_reload: true
    enabled: true
  when: unbound_reload.msg | default('') is search('Unable to reload')
  listen: Validate and activate unbound config

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Reload AppArmor policy in-kernel. apparmor_parser -r applies to
# already-running processes too, but unbound is typically dead by the
# time we get here (the EACCES on the control socket is fatal), so
# the "Restart unbound" handler below brings it back up.
- name: Reload unbound apparmor profile
  ansible.builtin.command:
    cmd: /sbin/apparmor_parser -r /etc/apparmor.d/usr.sbin.unbound
  changed_when: true
  when: unbound_apparmor_active | default(false) | bool

- name: Restart unbound
  ansible.builtin.systemd:
    name: unbound
    state: restarted
    daemon_reload: true
    enabled: true

- name: Restart unbound_exporter
  ansible.builtin.systemd:
    name: unbound_exporter
    state: restarted
    daemon_reload: true
    enabled: true
