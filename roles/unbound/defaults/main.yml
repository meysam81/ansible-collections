---
unbound_install_method: "apt"
unbound_apt_package: "unbound"

unbound_listen: "127.0.0.1"
unbound_port: 53
unbound_num_threads: 2
unbound_msg_cache_size: "32m"
unbound_rrset_cache_size: "64m"

# Cache: respect upstream TTLs, no prefetch, no stale serving.
# DNSBL operators (Spamhaus, SenderScore, Barracuda) explicitly forbid
# extending TTLs beyond the authoritative response or pre-fetching.
unbound_cache_min_ttl: 0
unbound_cache_max_ttl: 86400
# Negative-response TTL floor. Requires Unbound >= 1.19.0; leave null on
# older releases (e.g. Debian 12's 1.17.x) — the keyword will be omitted.
unbound_cache_min_negative_ttl: null
unbound_prefetch: false
unbound_serve_expired: false

# Hardening + privacy
unbound_qname_minimisation: true
unbound_dnssec_enabled: true
unbound_root_hints_path: "/var/lib/unbound/root.hints"
unbound_trust_anchor_path: "/var/lib/unbound/root.key"
unbound_edns_buffer_size: 1232
unbound_refuse_any: true

# Per-query/reply access logging to journald. Off by default to avoid
# flooding the journal on a busy resolver; enable for debugging.
unbound_query_logging: false

# Bundled Prometheus exporter (letsencrypt/unbound_exporter — actively
# maintained fork of the original kumina/unbound_exporter). Upstream
# only ships .deb packages, so we install via the dpkg-arch-named
# asset URL. Binary lands at /usr/bin/unbound_exporter.
unbound_exporter_disabled: true
unbound_exporter_version: "0.6.0"
unbound_exporter_deb_arch: >-
  {{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}
unbound_exporter_download_url: >-
  https://github.com/letsencrypt/unbound_exporter/releases/download/v{{
  unbound_exporter_version }}/unbound_exporter-v{{ unbound_exporter_version
  }}.{{ unbound_exporter_deb_arch }}.deb
unbound_exporter_binary_path: "/usr/bin/unbound_exporter"
unbound_exporter_listen: "127.0.0.1:9167"
unbound_exporter_control_socket: "/run/unbound/control.sock"

# Hygiene
unbound_disable_resolvers: true
unbound_manage_resolv_conf: true
# Contents of /etc/resolv.conf when unbound_manage_resolv_conf is true.
# Derived from unbound_listen so resolv.conf never advertises an address
# unbound does not bind (a stray `nameserver ::1` next to a v4-only
# listener makes every resolver library try ::1 first and eat an
# ECONNREFUSED before falling back). Override to list several servers.
unbound_resolvconf_nameservers: "nameserver {{ unbound_listen }}"

# Escape hatch
unbound_extra_config: ""
