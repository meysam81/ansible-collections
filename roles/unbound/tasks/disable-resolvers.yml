---
# ── Stop and mask everything that binds port 53 or steers unbound ───
#
# Each service is stopped, disabled, and masked. If the unit does not
# exist on the target host the task succeeds silently.

- name: Stop and mask conflicting DNS services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - bind9
    - dnscrypt-proxy
    - dnsmasq
    - dnsproxy
    - named
    - stubby
    - systemd-resolved
    # Ships with the Debian unbound package. Not a port-53 conflict: it
    # pushes the DHCP-supplied nameservers into the RUNNING daemon via
    # `unbound-control forward`, so a recursive resolver silently becomes
    # a forwarder with no trace in unbound.conf. It re-applies on boot
    # and on every DHCP renew, surviving a plain unbound restart.
    # Forwarding also breaks per-IP DNSBL quotas: the blocklist sees the
    # upstream resolver's egress IP, and shared resolvers get refused as
    # open resolvers.
    - unbound-resolvconf
  failed_when: false

- name: Check for runtime-injected forwarders
  ansible.builtin.command:
    cmd: /usr/sbin/unbound-control list_forwards
  register: unbound_runtime_forwards
  changed_when: false
  failed_when: false

# Masking the unit prevents future injections; this clears one already
# pushed into the live daemon, no restart needed.
- name: Drop runtime-injected forwarders to restore full recursion
  ansible.builtin.command:
    cmd: /usr/sbin/unbound-control forward off
  changed_when: true
  when:
    - unbound_runtime_forwards.rc == 0
    - unbound_runtime_forwards.stdout | trim | length > 0

- name: Stop and mask dnscrypt-proxy socket
  ansible.builtin.systemd:
    name: dnscrypt-proxy.socket
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Stop and mask kresd template instances
  ansible.builtin.systemd:
    name: "kresd@{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - "1"
    - "2"
    - "3"
  failed_when: false

# ── Disable ConnMan DNS proxy (without stopping ConnMan itself) ─────

- name: Gather service facts for DNS conflict resolution
  ansible.builtin.service_facts:

- name: Create ConnMan override directory
  ansible.builtin.file:
    path: /etc/systemd/system/connman.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: >-
    'connman.service' in ansible_facts.services
    and ansible_facts.services['connman.service'].state == 'running'

- name: Disable ConnMan DNS proxy
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/connmand -n --nodnsproxy
    dest: /etc/systemd/system/connman.service.d/disable-dns-proxy.conf
    mode: "0644"
    owner: root
    group: root
  when: >-
    'connman.service' in ansible_facts.services
    and ansible_facts.services['connman.service'].state == 'running'
  notify: Restart unbound

# ── Disable systemd-resolved stub listener ─────────────────────────

- name: Create resolved.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Disable systemd-resolved stub listener
  ansible.builtin.copy:
    content: |
      [Resolve]
      DNSStubListener=no
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
    mode: "0644"
    owner: root
    group: root

# ── Disable NetworkManager DNS management ───────────────────────────

- name: Create NetworkManager conf.d directory
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: >-
    'NetworkManager.service' in ansible_facts.services
    and ansible_facts.services['NetworkManager.service'].state == 'running'

- name: Disable NetworkManager DNS and resolv.conf management
  ansible.builtin.copy:
    content: |
      [main]
      dns=none
      rc-manager=unmanaged
    dest: /etc/NetworkManager/conf.d/90-dns-none.conf
    mode: "0644"
    owner: root
    group: root
  when: >-
    'NetworkManager.service' in ansible_facts.services
    and ansible_facts.services['NetworkManager.service'].state == 'running'
  register: unbound_nm_dns_config

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  when:
    - >-
      'NetworkManager.service' in ansible_facts.services
      and ansible_facts.services['NetworkManager.service'].state == 'running'
    - unbound_nm_dns_config is changed

# ── Disable resolvconf / openresolv ─────────────────────────────────

- name: Check if resolvconf is installed
  ansible.builtin.stat:
    path: /etc/resolvconf.conf
  register: unbound_resolvconf_stat

- name: Disable resolvconf
  ansible.builtin.lineinfile:
    path: /etc/resolvconf.conf
    regexp: "^resolvconf="
    line: "resolvconf=NO"
    create: false
  when: unbound_resolvconf_stat.stat.exists

# ── Write /etc/resolv.conf pointing at unbound ──────────────────────

- name: Write resolv.conf pointing to unbound
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"
    owner: root
    group: root
    backup: true
  when: unbound_manage_resolv_conf
