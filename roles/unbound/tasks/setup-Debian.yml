---
# ── Install unbound + helper utilities ──────────────────────────────

- name: Install unbound packages
  ansible.builtin.apt:
    name:
      - "{{ unbound_apt_package }}"
      - dns-root-data
    state: present
    update_cache: true
    cache_valid_time: 3600

# ── DNSSEC root key bootstrap ───────────────────────────────────────
#
# Seed the trust anchor from dns-root-data's /usr/share/dns/root.key,
# which Debian keeps in sync with IANA. Avoids the runtime dependency
# on the unbound-anchor binary (split into its own package on newer
# Debian/Ubuntu and not always present). After bootstrap, unbound
# keeps the key fresh per RFC 5011.

- name: Ensure unbound state directory exists
  ansible.builtin.file:
    path: /var/lib/unbound
    state: directory
    owner: unbound
    group: unbound
    mode: "0755"

- name: Install DNSSEC trust anchor from dns-root-data package
  ansible.builtin.copy:
    src: /usr/share/dns/root.key
    dest: "{{ unbound_trust_anchor_path }}"
    owner: unbound
    group: unbound
    mode: "0644"
    remote_src: true
    force: false

# ── Root hints (from dns-root-data package) ─────────────────────────

- name: Install root hints from dns-root-data package
  ansible.builtin.copy:
    src: /usr/share/dns/root.hints
    dest: "{{ unbound_root_hints_path }}"
    owner: unbound
    group: unbound
    mode: "0644"
    remote_src: true

# ── Render config (validated by handler before swap) ────────────────

- name: Ensure config directory exists
  ansible.builtin.file:
    path: /etc/unbound
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render unbound.conf to staging path
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf.next
    owner: root
    group: root
    mode: "0644"
  notify: Validate and activate unbound config

# ── AppArmor local override ────────────────────────────────────────
#
# Debian ships /etc/apparmor.d/usr.sbin.unbound which permits
# /run/unbound.pid but denies writes under /run/unbound/. That blocks
# the unbound-control unix socket created inside the systemd
# RuntimeDirectory= path with EACCES on bind(), regardless of
# filesystem ownership. Land a local override so the runtime dir is
# writable by the confined process; the rest of the profile stays
# enforcing.

- name: Detect AppArmor profile for unbound
  ansible.builtin.stat:
    path: /etc/apparmor.d/usr.sbin.unbound
  register: unbound_apparmor_profile

# The profile file is no proof that AppArmor confines anything: the
# unbound package ships it, but minimal cloud images (Hetzner's among
# them) leave out the `apparmor` package, so no policy is ever loaded
# and apparmor_parser does not exist. `ansible_apparmor.status` is not
# the test either -- it reports the kernel LSM flag, which reads
# "enabled" on exactly those hosts. Relax the profile only where a
# parser can load it; elsewhere unbound already runs unconfined and
# there is nothing to relax.
- name: Detect AppArmor policy parser
  ansible.builtin.stat:
    path: /sbin/apparmor_parser
  register: unbound_apparmor_parser

- name: Record whether AppArmor confinement is live
  ansible.builtin.set_fact:
    unbound_apparmor_active: >-
      {{ unbound_apparmor_profile.stat.exists and unbound_apparmor_parser.stat.exists }}

- name: Ensure AppArmor local override directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/local
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: unbound_apparmor_active | bool

- name: Install AppArmor local override for unbound runtime dir
  ansible.builtin.template:
    src: apparmor-local.j2
    dest: /etc/apparmor.d/local/usr.sbin.unbound
    owner: root
    group: root
    mode: "0644"
  when: unbound_apparmor_active | bool
  notify:
    - Reload unbound apparmor profile
    - Restart unbound

# ── Systemd unit (override Debian default) ─────────────────────────

- name: Deploy unbound systemd service
  ansible.builtin.template:
    src: unbound.service.j2
    dest: /etc/systemd/system/unbound.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart unbound

# ── Prometheus exporter (optional) ─────────────────────────────────

- name: Setup unbound_exporter
  ansible.builtin.include_tasks: setup-exporter.yml
  when: not unbound_exporter_disabled

# ── Kick handlers immediately so the service is up by end-of-play ──

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure unbound is enabled and started
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started
    daemon_reload: true
