---
# Own apt repo tasks — identical mechanism to crowdsec_agent's, duplicated
# rather than shared so this role stands alone per Galaxy consumption.
- name: Install CrowdSec apt repository dependencies
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download CrowdSec GPG key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    mode: "0644"
  register: crowdsec_haproxy_bouncer_gpg_key_download
  until: crowdsec_haproxy_bouncer_gpg_key_download is succeeded
  retries: 5
  delay: 5

- name: Dearmor CrowdSec GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/crowdsec-archive-keyring.gpg /etc/apt/keyrings/crowdsec.asc
    creates: /usr/share/keyrings/crowdsec-archive-keyring.gpg

- name: Add CrowdSec apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/crowdsec-archive-keyring.gpg]
      https://packagecloud.io/crowdsec/crowdsec/{{ ansible_facts['distribution'] | lower }}
      {{ crowdsec_haproxy_bouncer_apt_codename }} main
    filename: crowdsec
    state: present

- name: Install CrowdSec HAProxy SPOA bouncer
  ansible.builtin.apt:
    name: crowdsec-haproxy-spoa-bouncer
    state: present
    update_cache: true

# The package's postinst runs `cscli bouncers add` (when cscli/crowdsec is
# present) and writes the resulting key straight into this file — before
# our own template below ever touches it. Real unit/config name is
# "crowdsec-spoa-bouncer", not "crowdsec-haproxy-spoa-bouncer".
- name: Check for an existing bouncer config
  ansible.builtin.stat:
    path: /etc/crowdsec/bouncers/crowdsec-spoa-bouncer.yaml
  register: crowdsec_haproxy_bouncer_existing_config
  when: crowdsec_haproxy_bouncer_api_key | length == 0

- name: Read the API key the package postinst registered
  ansible.builtin.slurp:
    path: /etc/crowdsec/bouncers/crowdsec-spoa-bouncer.yaml
  register: crowdsec_haproxy_bouncer_existing_config_content
  when:
    - crowdsec_haproxy_bouncer_api_key | length == 0
    - crowdsec_haproxy_bouncer_existing_config.stat.exists | default(false)
  no_log: true

- name: Resolve the effective API key
  ansible.builtin.set_fact:
    crowdsec_haproxy_bouncer_effective_api_key: >-
      {{ crowdsec_haproxy_bouncer_api_key
         if crowdsec_haproxy_bouncer_api_key | length > 0
         else ((crowdsec_haproxy_bouncer_existing_config_content.content | b64decode | from_yaml).api_key | default('')) }}
  no_log: true

- name: Assert an API key is available
  ansible.builtin.assert:
    that:
      - crowdsec_haproxy_bouncer_effective_api_key | length > 0
      - "'<API_KEY>' not in crowdsec_haproxy_bouncer_effective_api_key"
    fail_msg: >-
      No usable CrowdSec API key for the HAProxy SPOA bouncer. Either set
      crowdsec_haproxy_bouncer_api_key explicitly, or ensure cscli/crowdsec
      was present on this host when crowdsec-haproxy-spoa-bouncer was
      installed (its postinst auto-registers a key via 'cscli bouncers add').
  no_log: true

- name: Deploy CrowdSec SPOA bouncer config
  ansible.builtin.template:
    src: crowdsec-spoa-bouncer.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-spoa-bouncer.yaml
    # The package's own /usr/lib/systemd/system/crowdsec-spoa-bouncer.service
    # runs as User=crowdsec-spoa Group=crowdsec-spoa (created by the package
    # postinst before this task runs). group: root here made the file
    # unreadable by that user — 0640 root:root — and the service failed to
    # start ("permission denied") on every apply. Matches the crowdsec.cfg
    # task below, which already owns its file by the group that reads it.
    owner: root
    group: crowdsec-spoa
    mode: "0640"
  notify: Restart crowdsec-spoa-bouncer

- name: Deploy CrowdSec SPOE config for HAProxy
  ansible.builtin.template:
    src: crowdsec.cfg.j2
    dest: "{{ crowdsec_haproxy_bouncer_haproxy_config_dir }}/crowdsec.cfg"
    owner: haproxy
    group: haproxy
    mode: "0640"
  notify: Restart crowdsec-spoa-bouncer

- name: Enable and start CrowdSec SPOA bouncer
  ansible.builtin.systemd:
    name: crowdsec-spoa-bouncer
    state: started
    enabled: true
    daemon_reload: true
