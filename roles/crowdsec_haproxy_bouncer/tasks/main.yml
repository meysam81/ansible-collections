---
- name: Assert prometheus listen address format
  ansible.builtin.assert:
    that:
      - crowdsec_haproxy_bouncer_prometheus_listen is match('^[^:]+:[0-9]+$')
    fail_msg: >-
      crowdsec_haproxy_bouncer_prometheus_listen must be 'host:port'
      (got: {{ crowdsec_haproxy_bouncer_prometheus_listen }})

- name: Setup CrowdSec HAProxy SPOA bouncer on Debian/Ubuntu
  ansible.builtin.import_tasks: setup-Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

# Ansible drops queued handlers when a play fails later on, and the next run
# sees the file already in place and never re-notifies: the config on disk
# and the running daemon silently diverge. Flushing here keeps the reload
# inside this role's own blast radius.
- name: Apply pending service reloads before leaving the role
  ansible.builtin.meta: flush_handlers
