---
- name: Reload postfix
  ansible.builtin.systemd:
    name: postfix
    state: reloaded
    enabled: true

- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted
    enabled: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
