---
- name: Check installed dnsproxy version
  ansible.builtin.command:
    cmd: /usr/local/bin/dnsproxy --version
  register: dnsproxy_installed_version
  changed_when: false
  failed_when: false

- name: Set dnsproxy install needed flag
  ansible.builtin.set_fact:
    dnsproxy_needs_install: >-
      {{ dnsproxy_installed_version.rc != 0 or
         ('v' + dnsproxy_version) not in (dnsproxy_installed_version.stdout | default('')) or
         dnsproxy_force_download }}

- name: Create secure temp directory
  ansible.builtin.tempfile:
    state: directory
    prefix: dnsproxy_
  register: dnsproxy_tmp_dir
  when: dnsproxy_needs_install

- name: Resolve dnsproxy archive sha256
  ansible.builtin.set_fact:
    dnsproxy_effective_sha256: >-
      {{ dnsproxy_sha256 if dnsproxy_sha256 | length > 0
      else (dnsproxy_known_sha256[dnsproxy_version][dnsproxy_arch] | default('')) }}
  when: dnsproxy_needs_install

- name: Warn that the dnsproxy archive is not verified
  ansible.builtin.debug:
    msg: >-
      No sha256 known for dnsproxy {{ dnsproxy_version }} ({{ dnsproxy_arch }});
      the archive is installed unverified. Set dnsproxy_sha256 to pin it.
  when:
    - dnsproxy_needs_install
    - dnsproxy_effective_sha256 | length == 0

- name: Download dnsproxy {{ dnsproxy_version }}
  ansible.builtin.get_url:
    url: "{{ dnsproxy_download_url }}"
    dest: "{{ dnsproxy_tmp_dir.path }}/{{ dnsproxy_download_url | basename }}"
    mode: "0644"
    checksum: "{{ ('sha256:' ~ dnsproxy_effective_sha256) if dnsproxy_effective_sha256 | length > 0 else omit }}"
  register: dnsproxy_download
  when: dnsproxy_needs_install

- name: Extract dnsproxy binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "{{ dnsproxy_download.dest }}"
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=2
      - --wildcards
      - "*/dnsproxy"
    mode: "0755"
    owner: root
    group: root
  when: dnsproxy_needs_install
  notify: Restart dnsproxy

- name: Verify binary works
  ansible.builtin.command:
    cmd: /usr/local/bin/dnsproxy --version
  changed_when: false

- name: Clean up temp files
  ansible.builtin.file:
    path: "{{ dnsproxy_tmp_dir.path }}"
    state: absent
  when: dnsproxy_needs_install

- name: Configure sysctl RW memory
  ansible.builtin.template:
    backup: true
    src: dnsproxy-sysctl.conf
    dest: /etc/sysctl.d/50-dnsproxy.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart dnsproxy

- name: Read dnsproxy sysctl config
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/50-dnsproxy.conf
  changed_when: false

- name: Deploy dnsproxy systemd service
  ansible.builtin.template:
    src: dnsproxy.service.j2
    dest: /etc/systemd/system/dnsproxy.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Enable and start dnsproxy

- name: Enable and start dnsproxy
  ansible.builtin.systemd:
    name: dnsproxy
    state: started
    enabled: true
    daemon_reload: true
