---
# augenrules regenerates /etc/audit/audit.rules from rules.d/*.rules and
# loads it directly into the kernel via auditctl (netlink) — no auditd
# process restart/reload involved, so this alone is sufficient whenever
# only the rules file changed.
- name: Reload audit rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true

# Debian's packaged auditd.service has no ExecReload= at all (confirmed via
# `systemctl cat auditd.service`), so `ansible.builtin.systemd: state:
# reloaded` (systemctl reload) always fails with "Job type reload is not
# applicable for unit auditd.service" — there's no reload job for systemd to
# run. Plugin registration (plugins.d/laurel.conf) and laurel's own
# config.toml are only read when auditd's dispatcher respawns its plugin
# children, which sending SIGHUP directly to the main PID does trigger,
# without stopping auditd itself (`man auditd` — SIGHUP reconfigures).
# `systemctl kill` sends the signal without needing a unit-defined reload
# job, and doesn't touch the unit's run state.
- name: Reload auditd
  ansible.builtin.command:
    cmd: systemctl kill -s HUP --kill-who=main auditd.service
  changed_when: true
