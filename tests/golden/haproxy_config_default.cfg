global
    user haproxy
    group haproxy
    maxconn 4096
    nbthread 2
    cpu-map auto:1/1-2 0-1

    ssl-default-bind-ciphers @SECLEVEL=2:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-ciphers @SECLEVEL=2:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    log stdout format raw local0 info
    log stdout format raw local1 notice
    log-send-hostname

    stats socket /run/haproxy.sock mode 660 group haproxy level operator expose-fd listeners
    stats timeout 30s

    tune.ssl.default-dh-param 4096
    tune.bufsize 32768
    tune.maxrewrite 8192
    tune.ssl.maxrecord 1460
    tune.ssl.cachesize 100000
    ocsp-update.mode on


defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout client-hs 10s
    timeout server 50s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout queue 30s
    timeout tunnel 3600s

    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm application/manifest+json

    log    global

    option dontlognull
    option forwardfor
    option http-server-close
    option httplog
    option log-health-checks
    option redispatch
    option splice-auto

    retries 3

    default-server check inter 10s fall 3 rise 2

    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 404 /etc/haproxy/errors/404.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 429 /etc/haproxy/errors/429.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ── Stats frontend ──────────────────────────────────────────────────
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    http-request use-service prometheus-exporter if { path /metrics }

# ── Main web frontend ──────────────────────────────────────────────
frontend web
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    bind [::]:80
    bind [::]:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1


    # Header dump for debugging, with credential values redacted BEFORE they
    # reach the var (and therefore the log line and the journal). Names stay
    # so the dump still shows which headers were sent. Case-insensitive (h2
    # lowercases names); `(^|\n)` anchors on a header-line start because
    # regsub has no multiline flag. Single-quoted regex inside a double-quoted
    # expression: `\\` reaches the regex engine as `\`, `\1` is a backref.
    # Nothing captures txn.resp_hdrs, so resp_hdrs logs empty; any future
    # capture of `res.hdrs` must go through the same regsub.
    http-request set-var(txn.req_hdrs) "req.hdrs,regsub('(^|\\n)((Authorization|Proxy-Authorization|Cookie|Set-Cookie|X-Api-Key):)[^\\r\\n]*','\\1\\2 [redacted]',gi)"
    log-format "${HAPROXY_HTTP_LOG_FMT} req_hdrs:%{+Q}[var(txn.req_hdrs)] resp_hdrs:%{+Q}[var(txn.resp_hdrs)]"



    unique-id-format %[uuid()]
    unique-id-header X-Unique-ID


    # --- Rate limiting ---
    stick-table type ip size 100k expire 30s store http_req_rate(10s),http_err_rate(10s),conn_rate(10s),conn_cur,gpc0,gpc0_rate(60s)
    http-request track-sc0 src
    http-request return status 429 if { sc_http_req_rate(0) gt 100 }
    http-request return status 429 if { sc_conn_rate(0) gt 50 }
    http-request return status 429 if { sc_conn_cur(0) gt 20 }
    http-request sc-inc-gpc0(0) if { path_beg /api/ }
    http-request return status 429 if { sc_gpc0_rate(0) gt 200 } { path_beg /api/ }

    http-request return status 403 if { path_end -i .php }
    http-request return status 403 if { path_end -i .asp }
    http-request return status 403 if { path_end -i .aspx }
    http-request return status 403 if { path_end -i .jsp }
    http-request return status 403 if { hdr(user-agent) -i -m sub (nmap|nikto|sqlmap|dirb|masscan) }

    http-request set-var(txn.req_body_param_name) req.body_param(name)
    http-request return status 400 if { var(txn.req_body_param_name) -m len gt 0 }
    http-request set-var(txn.req_body_param_company) req.body_param(company)
    http-request return status 400 if { var(txn.req_body_param_company) -m len gt 0 }
    http-request set-var(txn.req_body_param_website) req.body_param(website)
    http-request return status 400 if { var(txn.req_body_param_website) -m len gt 0 }


    filter compression

    acl is_options method OPTIONS

    http-request set-var(txn.path) path

    redirect scheme https code 301 if !{ ssl_fc }

    # --- Cache-Control (differentiated by content type) ---
    acl is_static_asset var(txn.path) -m end .js .css .woff .woff2 .ttf .eot .svg .png .jpg .jpeg .gif .ico .webp .avif
    acl is_hashed_asset var(txn.path) -m reg -i (/|[.~_-])[A-Za-z0-9_-]{6,64}\\.(js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|avif|ico|map)$
    acl has_cache_control res.hdr(Cache-Control) -m found
    # The asset values are for a served asset only. A redirect or an error on
    # an asset path (auth proxy 302, 404) must never be stored under them.
    acl is_cacheable_status status 200 206 304

    http-response set-header Cache-Control "public, max-age=31536000, immutable" if is_hashed_asset is_cacheable_status
    http-response set-header Cache-Control "public, max-age=86400, must-revalidate" if is_static_asset !is_hashed_asset is_cacheable_status
    http-response set-header Cache-Control "no-store" if is_static_asset !is_cacheable_status or is_hashed_asset !is_cacheable_status
    http-response set-header Cache-Control "no-cache" if !is_static_asset !has_cache_control

    # --- Security headers (configurable, backend-respecting) ---
    # `http-after-response` (vs `http-response`) so headers are also applied
    # to responses synthesised by HAProxy itself — `http-request return`,
    # `redirect`, `errorfile`, `deny`. `http-response` only fires for
    # responses coming back from a real backend, which means HSTS/CSP/etc.
    # silently disappear on inline responders, redirects, and error pages.
    http-after-response set-header Content-Security-Policy "default-src 'self' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' blob: data: https:; font-src 'self' data: https:; object-src 'none'; upgrade-insecure-requests" unless { res.hdr(Content-Security-Policy) -m found }
    http-after-response set-header Cross-Origin-Embedder-Policy "unsafe-none" unless { res.hdr(Cross-Origin-Embedder-Policy) -m found }
    http-after-response set-header Cross-Origin-Opener-Policy "same-origin" unless { res.hdr(Cross-Origin-Opener-Policy) -m found }
    http-after-response set-header Cross-Origin-Resource-Policy "same-site" unless { res.hdr(Cross-Origin-Resource-Policy) -m found }
    http-after-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), sync-xhr=()" unless { res.hdr(Permissions-Policy) -m found }
    http-after-response set-header Referrer-Policy "strict-origin-when-cross-origin" unless { res.hdr(Referrer-Policy) -m found }
    http-after-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" unless { res.hdr(Strict-Transport-Security) -m found }
    http-after-response set-header X-Frame-Options "SAMEORIGIN" unless { res.hdr(X-Frame-Options) -m found }
    http-after-response set-header X-XSS-Protection "1; mode=block" unless { res.hdr(X-XSS-Protection) -m found }

    # --- Hardcoded headers (universally safe) ---
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header X-DNS-Prefetch-Control off
    http-after-response set-header X-Download-Options noopen
    http-after-response set-header X-Permitted-Cross-Domain-Policies none
    http-after-response del-header Server
    http-after-response del-header X-Powered-By



    # --- Routing ---
    acl route_1 hdr(host) -i example.com
    use_backend app if route_1

    default_backend not_found

# ── Listen sections ─────────────────────────────────────────────────
# ── Backends ────────────────────────────────────────────────────────
backend app
    server s1 192.0.2.10:8080 check inter 3000 rise 1 fall 3

backend not_found
    http-request return status 404
